:root[data-theme=light]{--bg:#faf5ea;--ink:#1c1840;--card:#fffdf8;--ln:#eadfc2;--b:#4a2fbd;--bt:#fff;--m:#6a6585;--g:#1fae6b;--y:#e8b53a;--r:#e5484d;--gold:linear-gradient(135deg,#f6d77a,#d4a017 55%,#b8860b)}

syl=w=>syb(w).length,hy=w=>syb(w).join('-'),
W2=ALLW.filter(x=>syl(x)==2),W3=ALLW.filter(x=>syl(x)>=3),SYL=uniq(ALLW.flatMap(syb)),
scr=w=>{let s,n=0;do s=sh(w.split('')).join('');while(s==w&&n++<20);return s},
typo=w=>uniq([w[1]+w[0]+w.slice(2),w.slice(0,-1),w+w.slice(-1),w[0]+w.slice(2)]).filter(x=>x!=w),
alt=w=>{const a=hy(w),r=[];for(let i=1;i<w.length;i++){const x=w.slice(0,i)+'-'+w.slice(i);if(x!=a)r.push(x)}r.push(w.split('').join('-'),w);return r},
